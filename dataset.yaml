# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /home/publicuser/my_yolo/simd
train: train.txt # train images (relative to 'path')
val: val.txt
test: test.txt

nc: 15
names:
  0 : car
  1 : truck
  2 : van
  3 : longvehicle
  4 : bus
  5 : airliner
  6 : propeller
  7 : trainer
  8 : chartered
  9 : fighter
  10 : other
  11 : stairtruck
  12 : pushbacktruck
  13 : helicopter
  14 : boat

